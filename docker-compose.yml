services:
  backend:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    image: bllxk/kidsmathquest-backend:latest
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    image: bllxk/kidsmathquest-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
