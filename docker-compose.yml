services:
  backend:
    image: bllxk/kidsmathquest-backend:latest
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_MODE=local
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - NODE_ENV=production
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
      - db-data:/app/data
    networks:
      - app-network

  frontend:
    image: bllxk/kidsmathquest-frontend:latest
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kidsmathquest}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    profiles:
      - cloud

volumes:
  postgres-data:
  db-data:

networks:
  app-network:
    driver: bridge
